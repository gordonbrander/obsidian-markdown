<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ofm-note demo</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; }
      nav { margin-bottom: 12px; font-size: 14px; }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
      textarea { width: 100%; height: 80vh; box-sizing: border-box; font: 13px/1.5 ui-monospace, monospace; }
      #log { font-size: 12px; white-space: pre-wrap; }
    </style>
    <script type="module" src="/src/components/ofm-note.ts"></script>
  </head>
  <body>
    <nav>
      <a href="ofm-markdown.html">ofm-markdown</a> ·
      <a href="ofm-frontmatter.html">ofm-frontmatter</a> ·
      <label><input id="readonly" type="checkbox" /> readonly</label>
      <label><input id="strict" type="checkbox" /> strict line breaks</label>
    </nav>
    <main>
      <textarea id="source" aria-label="Note source" spellcheck="false">---
title: A New Hope
year: 1977
released: 1977-05-25
favorite: true
director: "[[George Lucas]]"
tags:
  - scifi
  - classic
cast:
  - Mark Hamill
  - "[[Carrie Fisher]]"
---
# A New Hope

The first film in the [[Star Wars]] saga. #scifi

> [!quote] Obi-Wan
> The Force will be with you. Always.

- [x] Watched
- [ ] Reviewed

Escape velocity: $v_e = \sqrt{2GM/r}$.
</textarea>
      <ofm-note id="note" types='{"year": "number", "released": "date"}'></ofm-note>
    </main>
    <pre id="log"></pre>

    <script type="module">
      import { adoptSheet } from '/src/adopt-sheet.ts';
      import { obsidianTheme } from '/src/ofm-theme.ts';

      adoptSheet(obsidianTheme);

      const source = document.querySelector('#source');
      const note = document.querySelector('#note');
      const log = document.querySelector('#log');
      const show = (e) => {
        log.textContent = `${e.type} ${JSON.stringify(e.detail)}\n${log.textContent}`;
      };
      source.addEventListener('input', () => { note.value = source.value; });
      note.addEventListener('proprow-change', show);
      note.addEventListener('click-wikilink', (e) => { e.preventDefault(); show(e); });
      document.querySelector('#readonly').addEventListener('change', (e) => { note.readonly = e.target.checked; });
      document.querySelector('#strict').addEventListener('change', (e) => { note.strictLineBreaks = e.target.checked; });
      note.value = source.value;
    </script>
  </body>
</html>
