<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>obsidian-markdown</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0 auto; padding: 16px; max-width: 760px; font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <ofm-note readonly></ofm-note>

    <script type="module">
      import '/src/components/ofm-note.ts';
      import { adoptSheet } from '/src/adopt-sheet.ts';
      import { obsidianTheme } from '/src/ofm-theme.ts';
      import readme from '../README.md?raw';

      // Page links live in front matter, so the Properties drawer shows them.
      const frontmatter = `---
title: obsidian-markdown
github: https://github.com/gordonbrander/obsidian-markdown
license: https://github.com/gordonbrander/obsidian-markdown/blob/main/LICENSE-MIT
demos:
  - "[[ofm-note.html|ofm-note]]"
  - "[[ofm-markdown.html|ofm-markdown]]"
  - "[[ofm-frontmatter.html|ofm-frontmatter]]"
---
`;

      adoptSheet(obsidianTheme);
      document.querySelector('ofm-note').value = frontmatter + readme;
    </script>
  </body>
</html>
