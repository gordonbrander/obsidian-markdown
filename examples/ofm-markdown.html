  </head>

</textarea>
      <ofm-markdown id="note"></ofm-markdown>
    </main>
    <pre id="log"></pre>

    <script type="module">
      import { adoptSheet } from '/src/adopt-sheet.ts';
      import { obsidianTheme } from '/src/ofm-theme.ts';

      adoptSheet(obsidianTheme);

      const source = document.querySelector('#source');
      const note = document.querySelector('#note');
      const log = document.querySelector('#log');
      const show = () => { note.value = source.value; };
      source.addEventListener('input', show);
      note.addEventListener('wikilink', (e) => {
        log.textContent = `wikilink ${JSON.stringify(e.detail)}\n${log.textContent}`;
      });
      note.addEventListener('rendered', () => {
        log.textContent = `rendered\n${log.textContent}`;
      });
      show();
    </script>
  </body>
