<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ofm-markdown demo</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
      textarea { width: 100%; height: 80vh; box-sizing: border-box; font: 13px/1.5 ui-monospace, monospace; }
      #log { font-size: 12px; white-space: pre-wrap; }
    </style>
    <script type="module" src="/src/components/ofm-markdown.ts"></script>
  </head>
  <body>
    <main>
      <textarea id="source" aria-label="Markdown source" spellcheck="false"></textarea>
      <ofm-markdown id="note"></ofm-markdown>
    </main>
    <pre id="log"></pre>

    <script type="module">
      import { adoptSheet } from '/src/adopt-sheet.ts';
      import { obsidianTheme } from '/src/ofm-theme.ts';
      import { doc } from './demo.js';

      adoptSheet(obsidianTheme);

      const source = document.querySelector('#source');
      const note = document.querySelector('#note');
      const log = document.querySelector('#log');
      const show = () => { note.value = source.value; };
      source.addEventListener('input', show);
      note.addEventListener('wikilink-click', (e) => {
        e.preventDefault(); // Log the link instead of following it.
        log.textContent = `wikilink-click ${JSON.stringify(e.detail)}\n${log.textContent}`;
      });
      for (const type of ['markdown-rendered', 'markdown-loaded']) {
        note.addEventListener(type, () => {
          log.textContent = `${type}\n${log.textContent}`;
        });
      }
      source.value = doc;
      show();
    </script>
  </body>
</html>
